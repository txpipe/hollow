[package]
name = "balius-sdk"
version = "0.5.2"
edition = "2021"

description = "SDK for building Headless dApps on UTxO-based blockchains"
license = "Apache-2.0"
repository = "https://github.com/txpipe/balius"
readme = "README.md"

[dependencies]
balius-core = { version = "0.5.2", path = "../balius-core" }
balius-macros = { version = "0.5.2", path = "../balius-macros" }
hex = "0.4.3"
pallas-addresses = { version = "1.0.0" }
pallas-codec = { version = "1.0.0" }
pallas-crypto = { version = "1.0.0" }
pallas-primitives = { version = "1.0.0" }
pallas-traverse = { version = "1.0.0" }
prost = "0.13.3"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
serde_with = "3.9.0"
thiserror = "2.0.11"
tracing = "0.1.40"
tracing-subscriber = "0.3"
url = "2.5"
wit-bindgen = "0.39.0"
